name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # PR: check out the head branch so migrate commits can be pushed back.
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup toolchain with mise
        uses: jdx/mise-action@v4.3.0
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Biome config with installed version
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pnpm exec biome migrate --write
          if git diff --quiet biome.json; then
            echo "biome.json already in sync with installed Biome"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" = "$REPOSITORY" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add biome.json
            git commit -m "chore: sync biome.json with installed Biome"
            git push origin "HEAD:$HEAD_REF"
            exit 0
          fi

          echo "biome.json is out of sync with installed Biome. Run: pnpm exec biome migrate --write"
          git diff --exit-code biome.json

      - name: Run Biome checks
        run: pnpm exec biome ci

      - name: Run production build
        run: pnpm build

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Run security audit
        run: pnpm audit --audit-level high

      - name: Install Playwright browsers and system deps
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        id: playwright
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.playwright.outcome == 'failure' }}
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 14
